name: Notion Sync

on:
  push:
    branches: [main]
    paths:
      - README.md

jobs:
  sync-readme:
    name: Sync README.md → Notion Wiki
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: agonzalezl/readme-to-notion-action@88b6cb8eea354ac61c589f540e40cacadf0c8ecb
        with:
          notion-token: ${{ secrets.NOTION_TOKEN }}
          notion-page-id: ${{ secrets.NOTION_WIKI_PAGE_ID }}
          file-path: ./README.md
          static-top-text: "⚠️ Auto-synced from README.md in the repository. Edit the source file, not this page."
