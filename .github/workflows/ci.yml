name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build MockingBirdCore
        run: swift build --target MockingBirdCore

      - name: Build mockingbird CLI
        run: swift build --target MockingBirdCLI

      - name: Build mockingbird-server
        run: swift build --target MockingBirdServer

      - name: Run tests
        run: swift test --filter MockingBirdCoreTests

      - name: Run CLI tests
        run: swift test --filter MockingBirdCLITests
